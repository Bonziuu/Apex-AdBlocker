# Apex AdBlocker – CI: każdy push i Pull Request.
# Instalacja zależności, Chromium dla Playwright, `npm test`, `npm run check`
# i budowa paczki gotowej do Chrome Web Store.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test + npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zależności
        run: npm ci --no-audit --no-fund

      - name: Instalacja Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test -- --test-reporter=tap | tee test.log
          grep -Eq '^# skipped 0$' test.log || { echo '::error::Część testów została pominięta (SKIP) – w CI wszystkie testy muszą się wykonać.'; exit 1; }

      - name: npm run check
        shell: bash
        run: |
          set -o pipefail
          npm run check -- --require-browser | tee check.log
          if grep -q 'SKIP: Chromium smoke test unavailable' check.log; then
            echo '::error::Smoke test w Chromium nie został uruchomiony.'; exit 1
          fi

      - name: Paczka Chrome Web Store
        run: npm run package:store

      - name: Artefakt Chrome Web Store
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AdBlocker-WebStore
          path: dist/Apex-AdBlocker-WebStore-*.zip
          if-no-files-found: error
          retention-days: 30
